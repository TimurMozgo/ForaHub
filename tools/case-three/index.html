<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ежедневный · Настоящий 3D</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#080e19;color:#e9f5ff;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 20px}header{display:flex;align-items:center;justify-content:space-between;color:#71869f;font-size:11px;letter-spacing:.18em}header strong{color:#bed0e3}small{color:#4be2eb;letter-spacing:.25em;font-size:10px}.title{text-align:center;margin-top:44px}h1{font-size:clamp(30px,6vw,46px);font-weight:500;letter-spacing:-.04em;margin:12px 0}p{color:#7c90a8;font-size:13px}#viewport{width:100%;height:clamp(340px,56svh,590px);touch-action:none;cursor:grab}#viewport:active{cursor:grabbing}canvas{display:block}footer{text-align:center}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:1px solid #5ee7ed55;background:#a5eff1;color:#0c252c;border-radius:13px;font:600 13px system-ui;padding:14px 24px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.secondary{background:#ffffff06;color:#9caec2;border-color:#ffffff15}button:focus-visible{outline:2px solid #eff;outline-offset:4px}#status{min-height:20px}#result{margin-top:-28px;position:relative;pointer-events:none}#result h2{font-size:25px;margin:6px}label{display:block;font-size:11px;color:#748ba3;margin:17px 0}input{accent-color:#5ee7ed}#download{font-size:10px;padding:9px 12px}.note{font-size:10px;color:#53677f}@media(max-height:760px){.title{margin-top:22px}main{padding-top:18px}#viewport{height:400px}}
.embedded header{display:none}.embedded main{padding:20px 10px}.embedded .title{margin-top:0}.embedded .title h1{font-size:26px}.embedded .title p{font-size:12px}.embedded #viewport{height:390px}.embedded button{padding:11px 15px}.embedded #choices{gap:7px}.embedded .note{margin-bottom:0}@media(max-width:600px){.embedded #viewport{height:335px}.embedded main{padding:16px 5px}.embedded .title h1{font-size:24px}.embedded #choices button{padding:10px 13px;font-size:12px}} </style></head><body><main><header><strong>GAME HUB</strong><button id="download" class="secondary" disabled>Скачать GLB ↓</button></header><section class="title"><small>ОБЪЁМ · МЕТАЛЛ · ЭНЕРГИЯ</small><h1>Выбери свой бокс</h1><p>Три бокса. Твой выбор.</p></section><div id="viewport"></div><footer><div id="choices" class="controls"><button data-box="0">Искра</button><button data-box="1" style="background:#d8b5ff">Импульс</button><button data-box="2" style="background:#f7d58d">Легенда</button></div><div id="result" hidden><small>ТВОЙ ПРИЗ</small><h2>Звёздная энергия</h2></div><p id="status" role="status">Загружаем модель…</p><div class="controls"><button id="open" disabled>Открыть сундук</button><button id="reset" class="secondary">К выбору боксов</button><button id="resume" class="secondary" hidden>Продолжить</button></div><label><input id="gentle" type="checkbox"> Мягкое движение</label><p class="note">Three.js · GLB · GSAP / Демо без оплаты и выдачи призов</p></footer></main><script src="app.bundle.js"></script></body></html>
