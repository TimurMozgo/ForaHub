<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TinellGame — много миров, один хаб</title><link rel="icon" type="image/png" href="/ForaHub/tinellgame-logo-v2.png"><link rel="apple-touch-icon" href="/ForaHub/tinellgame-logo-v2.png"><script defer src="https://telegram.org/js/telegram-web-app.js"></script><script defer src="/ForaHub/pages-local.js"></script><link rel="preload" as="image" href="/ForaHub/tinellgame-logo-v2.png">
<style>
html,body{margin:0;background:#101114}
#hub-boot{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 46%,#dfbd800b,transparent 55%),#101114;color:#dfbd80;transition:opacity .45s ease;overscroll-behavior:none;touch-action:none}
#hub-boot.leaving{opacity:0;pointer-events:none}
.boot-content{width:min(220px,65vw);text-align:center;transform:translateY(-20px)}
.boot-emblem{position:relative;isolation:isolate;margin:0 auto 32px}
.boot-emblem::before{content:"";position:absolute;z-index:-1;inset:-45% -22%;pointer-events:none;background:radial-gradient(ellipse,#dfbd8038 0%,#d3a5581c 38%,transparent 72%);opacity:.55;transform:scale(.94);animation:boot-glow 2.6s ease-in-out infinite}
.boot-logo{display:block;width:100%;height:auto;filter:drop-shadow(0 0 9px #dfbd8026);transform-origin:center;animation:boot-breathe 2.6s ease-in-out infinite}
@keyframes boot-glow{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:.9;transform:scale(1.06)}}
@keyframes boot-breathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.025);opacity:1}}
#hub-boot.ready .boot-emblem::before,#hub-boot.ready .boot-logo,#hub-boot.failed .boot-emblem::before,#hub-boot.failed .boot-logo{animation-play-state:paused}
.boot-track{height:4px;overflow:hidden;border-radius:999px;background:#dfbd801a}
.boot-fill{height:100%;width:100%;transform:scaleX(0);transform-origin:left center;border-radius:inherit;background:linear-gradient(90deg,#b78b46,#f2dba5);box-shadow:0 0 14px #dfbd8055;animation:boot-progress 3s linear forwards}
.boot-error{display:none;font:13px/1.6 system-ui;margin-top:24px;color:#c9c3b8}
.boot-error button{display:block;margin:12px auto 0;padding:10px 18px;border:1px solid #dfbd8044;border-radius:9px;background:#dfbd8014;color:#dfbd80;font:inherit;cursor:pointer}
#hub-boot.failed .boot-error{display:block}
@keyframes boot-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){#hub-boot,.boot-fill{transition:none}.boot-fill{animation:none;transform:scaleX(1)}.boot-content{transform:none}.boot-logo,.boot-emblem::before{animation:none;transform:none}.boot-logo{opacity:1}.boot-emblem::before{opacity:.65}}
</style></head><body><div id="hub-boot" role="status" aria-label="Загрузка TinellGame"><div class="boot-content"><div class="boot-emblem"><img class="boot-logo" src="/ForaHub/tinellgame-logo-v2.png" alt="TinellGame" width="220" height="103" fetchpriority="high"></div><div class="boot-track" aria-hidden="true"><div class="boot-fill"></div></div><div class="boot-error">Не удалось загрузить хаб.<button type="button" onclick="location.reload()">Попробовать снова</button></div></div></div><div id="root" class="boot-pending" inert aria-hidden="true"></div>
<script>
(()=>{
 const boot=document.getElementById('hub-boot'),root=document.getElementById('root');
 const fill=boot.querySelector('.boot-fill');
 const progressFinished=new Promise(resolve=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){setTimeout(resolve,3000);return;}
  const fallback=setTimeout(resolve,3500);
  fill.addEventListener('animationend',()=>{clearTimeout(fallback);resolve()},{once:true});
 });
 const failure=setTimeout(()=>boot.classList.add('failed'),20000);
 window.addEventListener('tinell:ready',async()=>{
  clearTimeout(failure);
  const logo=boot.querySelector('img');
  await Promise.race([Promise.allSettled([logo.decode(),document.fonts.ready]),new Promise(r=>setTimeout(r,2500))]);
  await progressFinished;
  boot.classList.add('ready');
  root.removeAttribute('inert');root.removeAttribute('aria-hidden');
  boot.classList.add('leaving');
  setTimeout(()=>{boot.remove();root.classList.remove("boot-pending");window.dispatchEvent(new Event("tinell:entered"))},500);
 },{once:true});
})();
</script><script type="module" src="/main.tsx"></script></body></html>
